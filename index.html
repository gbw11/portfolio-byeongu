<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Portfolio</title>
  <meta name="description" content="공병우 · Data Engineer 포트폴리오" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <link rel="stylesheet" href="style.css" />
  <script>
    try {
      var t = localStorage.getItem("theme");
      if (t) document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
</head>
<body>
  <header class="nav">
    <div class="nav-inner">
      <a href="#top" class="brand" id="brand"></a>
      <nav class="nav-links">
        <a href="#projects">프로젝트</a>
        <a href="#skills">기술</a>
        <a href="#about">이력</a>
        <a href="#contact">연락</a>
      </nav>
      <a class="nav-gh gh-link" target="_blank" rel="noopener">GitHub ↗</a>
      <button class="theme-btn" id="themeBtn" aria-label="테마 전환">◐</button>
    </div>
  </header>

  <main id="top">
    <section class="hero">
      <div class="wrap hero-grid">
        <div>
          <p class="eyebrow" id="eyebrow"></p>
          <h1 id="tagline"></h1>
          <div class="intro" id="intro"></div>
          <div class="cta">
            <a class="btn primary" href="#projects">프로젝트 보기</a>
            <a class="btn gh-link" target="_blank" rel="noopener">GitHub ↗</a>
          </div>
        </div>
        <div class="avatar" id="avatar"></div>
      </div>
      <div class="wrap">
        <div class="highlights" id="highlights"></div>
      </div>
    </section>

    <section id="projects" class="section">
      <div class="wrap">
        <p class="sec-num">01</p>
        <h2>프로젝트</h2>
        <div class="filter-row" id="filterRow">
          <span class="label">트러블슈팅 분야</span>
          <div class="field-filter" id="fieldFilter"></div>
        </div>
        <div id="projectList"></div>
      </div>
    </section>

    <section id="skills" class="section alt">
      <div class="wrap">
        <p class="sec-num">02</p>
        <h2>기술</h2>
        <div class="skill-grid" id="skillGrid"></div>
      </div>
    </section>

    <section id="about" class="section">
      <div class="wrap">
        <p class="sec-num">03</p>
        <h2>이력</h2>
        <div class="about-grid">
          <div>
            <h3 class="label">학력 · 교육</h3>
            <ul class="plain" id="eduList"></ul>
          </div>
          <div>
            <h3 class="label">자격</h3>
            <ul class="chips" id="certList"></ul>
          </div>
        </div>
      </div>
    </section>

    <section id="contact" class="section alt">
      <div class="wrap contact">
        <p class="sec-num">04</p>
        <h2>연락</h2>
        <p class="muted">함께 일할 기회를 기다리고 있습니다.</p>
        <div class="cta">
          <a class="btn primary" id="mailBtn"></a>
          <a class="btn gh-link" target="_blank" rel="noopener">GitHub ↗</a>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer"><div class="wrap" id="footer"></div></footer>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
